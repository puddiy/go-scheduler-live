# Quality gate for every push and pull request. The three jobs mirror the three
# layers of the project: the Go pipeline, the frontend's pure logic, and the
# interactive control contract that only a real browser can check.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      # v9 is the line that understands the v2 config format in .golangci.yml.
      # The version is pinned so CI and a developer's machine flag the same
      # things — a linter that drifts on its own turns green into red overnight.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Scenario tests record real traces in subprocesses, so this is the slow
      # job — and the one that actually asserts scheduler invariants.
      - name: Run tests and report coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          echo "### Go Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 25 coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cross-compile
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...

  web:
    name: Web — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - name: Run unit tests with coverage
        run: |
          npx vitest run --coverage | tee coverage.txt
          echo "### Web Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 25 coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - run: npx vite build

  controls:
    name: Controls — Playwright contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The backend shells out to `go run ./cmd/workload` per request, so on a
      # cold runner the first trace would spend its budget compiling. The
      # contract only waits 20s for that first run — warm the build cache here
      # instead of loosening the timeout, so CI behaves like a warm dev machine.
      - name: Warm the build cache
        run: go build ./...

      # The contract drives the live app, so it needs both halves running: the
      # backend records a fresh trace per scenario switch, exactly as it does on
      # a developer's machine. Servers start and the contract runs in one step —
      # background processes are not guaranteed to survive a step boundary.
      # On failure the reason is echoed as ::error:: annotations, not just left
      # in the step log: annotations are readable from the public API, the log
      # is not, so a red run stays diagnosable without repository credentials.
      - name: Verify control contract
        run: |
          go run ./cmd/server -addr :8085 > "$RUNNER_TEMP/server.log" 2>&1 &
          (cd web && GMP_API_TARGET=http://localhost:8085 exec npx vite --port 5173 --strictPort) > "$RUNNER_TEMP/vite.log" 2>&1 &
          curl -s --retry 90 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8085/api/scenarios
          curl -s --retry 90 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:5173/

          set +e
          (cd web && node scripts/verify-controls.mjs) 2>&1 | tee "$RUNNER_TEMP/controls.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            grep '^FAIL' "$RUNNER_TEMP/controls.log" | while read -r line; do
              echo "::error::$line"
            done
            # GitHub keeps only ~10 annotations per step, so spend them on the
            # reason and the failures — never on the checks that passed.
            grep -E '^(abort reason|BOOT FAILED|CONTRACT ABORTED|  FAIL|FAIL)' "$RUNNER_TEMP/controls.log" | head -n 8 | while read -r line; do
              echo "::error::$line"
            done
            echo "::error::contract exited $status — tail: $(tail -n 12 "$RUNNER_TEMP/controls.log" | tr '\n' ' | ')"
            echo "::error::backend tail: $(tail -n 4 "$RUNNER_TEMP/server.log" | tr '\n' ' | ')"
          fi
          exit $status
        env:
          SHOOT_URL: http://localhost:5173
          SHOOT_OUT: ${{ runner.temp }}
          # A hosted runner is slower than a dev machine and every scenario
          # switch records a real trace; stretch the bounds rather than assert
          # the runner's speed.
          CONTRACT_TIMEOUT_SCALE: '3'

      - name: Upload server and frontend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-failure-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: control-failure-shots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
